      # fields. NOT a fallback violation per LOADER-CONTRACT no-fallback
      # rule — this source is GENUINELY scoped to Salt Lake City / UT / US;
      # the defaults reflect source-level truth, not synthesis.
      location_default:
        city: Salt Lake City
        state: UT
        country: US

