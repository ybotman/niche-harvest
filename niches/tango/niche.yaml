      display_name: Wasatch Tango (Salt Lake City)
      url: https://calendar.google.com/calendar/ical/wasatchtango%40gmail.com/public/basic.ics
      adapter: ical
      trusted: true
      priority: high
      check_interval_days: 3
      timezone_hint: America/Denver
      # Per-source location defaults (Harvey's gcal-harvest pattern; see
      # harvester/scripts/gcal-harvest.ts:513). Used by parse-location.ts
