# niche.yaml — Tango (appId=1) — niche-harvest M1 starting inventory
#
# AUTHORITY: This file is THE niche definition contract. core/config.ts loads it;
# every niche-specific behavior in core/ flows from values declared here. Adding
# a new niche means creating niches/<name>/niche.yaml — zero core code changes.
#
# REFERENCES:
#   - LOADER-CONTRACT.md §7 — category taxonomy authority (tango = 10 strings)
#   - LOADER-CONTRACT.md §16.5 — cross-niche abstraction points (what each niche.yaml drives)
#   - ARCHITECTURE.md §4 — adapter interface + registry keys
#   - SAFEGUARD-SPEC.md §3-4 — FB rate-limiter + block-detector values
#   - AIDI 2026-04-24 (memory: project_niche_harvest_m1_scope) — M1 source scope
#   - Booker 2026-04-24 candidate CSV — Collab/handoffs/narvest/m1-group-inheritance-candidates.csv
#
# DRAFT — first cut 2026-04-24. Will tighten as Phase 1 implementation surfaces gaps.

niche:
  key: tango
  display_name: Tango (Argentine)
  appid: 1                          # MasterCalendar appId; FE = TangoTiempo
  language_default: en
  description: >
    Argentine Tango community calendar coverage. Sources are the existing
    Harvey/Booker/Porter inventory (parity goal per Toby 2026-04-24).

# Runtime persona identity (per ARCHITECTURE §7.0.1)
persona:
  runtime_name: narvest-tango
  runtime_port: 8814

# ─────────────────────────────────────────────────────────────────────────────
# TAXONOMY — categories, identity check, rendered attributes
# Tango-specific values; framework mechanism is universal (LOADER-CONTRACT §16.5).
# ─────────────────────────────────────────────────────────────────────────────
taxonomy:

  # Identity check — gate at ingestion: "is this a tango event at all?"
  # Untrusted sources must pass identity_check; trusted sources skip it.
  # Tuned to the keyword set Booker's classify.ts uses + AS-IS evidence.
  identity_check:
    require_min_signals: 1
    positive_keywords:
      # Core dance-form terms
      - tango
      - milonga
      - practica
      - práctica
      - vals
      - milonguero
      - tanguera
      - tanguero
      # Music + culture
      - bandoneon
      - bandoneón
      - cortina
      - tanda
      - abrazo
      - "tango nuevo"
      - "tango salon"
      - "tango argentino"
      - "argentine tango"
      # Format-specific (only count when paired with tango context elsewhere)
      - encuentro
      - marathon         # generic; identity_check engine should require co-signal
    negative_keywords:
      # Hard-no terms — if present, event is NOT tango regardless of positives
      - "ballroom tango"
      - "tango fitness"
      - "yoga tango"

  # Categories — the 10 valid categoryFirst strings (LOADER-CONTRACT §7.1).
  # `loadable: true` = sent to Mongo when classifier resolves to this category;
  # `loadable: false` = quality_flag with skip_reason per LOADER-CONTRACT §7.3.
  # Class is opt-in per niche — tango M1 default OFF (matches Porter today).
  #
  # Drift note (AIDI 2026-04-25 Phase 3 review; updated AIDI/Fulton 2026-04-27):
  #   - BE categories include 'Other' not modeled here.
  #   - 'DayWorkshop' was deprecated by CALBEAF-154 (Fulton 2026-04-27);
  #     Workshop now covers the FLEX bucket — niche.yaml stays as-is since
  #     DayWorkshop was never modeled here anyway.
  #   - 'Performance' below maps to skip_performance at classify time and
  #     never reaches the categoryFirstId resolver — safe today.
  #   - If 'Performance' ever becomes a load target, add 'Other' as its
  #     BE category_id mapping in core/loader/categories.ts (or rename
  #     'Performance' → 'Other' here so the resolver finds it).
  categories:
    # SHORT (>=15m, <24h)
    - name: Milonga
      duration_group: SHORT
      loadable: true
      travel_worthy_eligible: false
      beginner_eligible: false
    - name: Practica
      duration_group: SHORT
      loadable: true
      travel_worthy_eligible: false
      beginner_eligible: false
    - name: Class
      duration_group: SHORT
      loadable: false              # opt-in via loader.load_classes (default false)
      travel_worthy_eligible: false
      beginner_eligible: true

    # LONG (>=24h, <=168h)
    - name: Festival
      duration_group: LONG
      loadable: true
      travel_worthy_eligible: true
      beginner_eligible: false
    - name: Marathon
      duration_group: LONG
      loadable: true
      travel_worthy_eligible: true
      beginner_eligible: false
    - name: Encuentro
      duration_group: LONG
      loadable: true
      travel_worthy_eligible: true
      beginner_eligible: false
    - name: Workshop
      duration_group: LONG
      loadable: true
      travel_worthy_eligible: true
      beginner_eligible: true

    # NEUTRAL (skip — emit quality_flag with skip_reason)
    - name: Trip
      duration_group: NEUTRAL
      loadable: false              # skip_trip
      travel_worthy_eligible: false
      beginner_eligible: false
    - name: Unknown
      duration_group: NEUTRAL
      loadable: false              # skip_unknown — routes to NEW human triage
      travel_worthy_eligible: false
      beginner_eligible: false
    - name: Performance
      duration_group: NEUTRAL
      loadable: false              # skip_performance (Discovery-only category)
      travel_worthy_eligible: false
      beginner_eligible: false

  # Rendered attributes — niche-specific event attribute fields the FE displays.
  # Classifier may extract these from text; loader pre-computes them for events.
  # NOT category-defining; metadata only. (LOADER-CONTRACT §5.4)
  rendered_attributes:
    - name: dj
      label: "DJ"
      kind: string
    - name: orchestra
      label: "Orchestra (LIVE!)"
      kind: string
    - name: instructor
      label: "Instructor"
      kind: string
    - name: cost
      label: "Cost"
      kind: string

  # Attributes captured for analysis but never written to Mongo
  # (LOADER-CONTRACT §1: attributes stays in SQLite, never to MongoDB).
  internal_only_attributes:
    - level                        # absolute beginner / open / advanced — feeds beginner_eligible classifier
    - style                        # nuevo / salon / milonguero — feeds search-only filters someday
    - musicType                    # alt-tango / traditional / nuevo — research only

# ─────────────────────────────────────────────────────────────────────────────
# GEOCODE — Nominatim trust + bounds
# (LOADER-CONTRACT §16.5 — niche.yaml owns trusted_country_codes)
# ─────────────────────────────────────────────────────────────────────────────
geocode:
  # Country codes whose Nominatim hits we accept by default.
  # If geocoder returns a hit OUTSIDE this list, treat as low-confidence and
  # require additional venue-name signal to accept.
  trusted_country_codes:
    - US                           # all 11 YES FB groups + slc-wasatch + nytango
    - CA                           # tango.berlin via overlap; CA tango venues
    - AR                           # Argentina — origin niche
    - DE                           # tango.berlin
    - NL                           # Amsterdam in MAYBE tier (post-M1 inherit)
    - PL                           # Krakow in MAYBE tier
    - CH                           # Zürich in MAYBE tier
    - GB                           # UK tango scene (post-M1)
    - IT                           # Italy tango scene (post-M1)
    - FR                           # France tango scene (post-M1)
    - AU                           # Melbourne in MAYBE tier
    - TH                           # Bangkok in MAYBE tier
  # Reject if geocoder hits one of these (false-positive prone)
  reject_country_codes:
    - XK                           # Kosovo (frequent geocoder false-hit)
  # Distance-from-venue-text bound: reject if Nominatim result is >50km from
  # any city/state hint in venue text. Caller passes hints to nominatim wrapper.
  text_distance_bound_km: 50

# ─────────────────────────────────────────────────────────────────────────────
# LOADER — niche-specific load behavior (LOADER-CONTRACT §7.1.1, §16.5)
# ─────────────────────────────────────────────────────────────────────────────
loader:
  # Class loading: opt-in per niche. Tango M1 default OFF — matches Porter
  # today. Toggle to true to enter Class events into Mongo (still subject
  # to all other gates).
  load_classes: false

  # Discovery source string written to Mongo on every venue + event.
  discovery_source: "niche-harvest"

  # Trust level written to events.trustLevel (PROCESS.md trust ladder).
  trust_level: "ai_discovered"

  # Mongo target environment for this niche. M1 = TEST only (PROD requires
  # explicit Toby reauth per PROD-DEPLOY-PROTECTION.md; do NOT change here).
  mongo_env: test

  # Batch size for direct-Mongo event inserts (LOADER-CONTRACT §8.4).
  batch_size: 15

# ─────────────────────────────────────────────────────────────────────────────
